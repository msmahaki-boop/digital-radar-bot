name: Acolad API failure vs editorial veto reporting QA NO API
on:
  push:
    branches: [fix/acolad-v4-separate-api-failure-from-editorial-20261107]
    paths: [ops/acolad-api-veto-classification.trigger]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - run: python -m py_compile acolad_v4_hourly_publish.py
      - run: python -m unittest discover -s tests -p 'test_acolad_api_failure_vs_quality.py' -v
