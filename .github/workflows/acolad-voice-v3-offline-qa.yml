name: Acolad Voice V3 — Narrative Tone/Chronology Regression (NO PUBLICATION)
on:
  push:
    branches: [feature/acolad-voice-v3-20261104]
    paths: [ops/acolad-voice-v3-preview.trigger]
permissions:
  contents: read
jobs:
  narrative-offline-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile without connecting to any social network
        run: python -m py_compile acolad_voice_v3_guard.py
      - name: Independent offline narrative regression tests (no secrets, no billed calls)
        run: |
          python -m unittest discover -s tests -p 'test_acolad_voice_v3.py' -v
          python acolad_voice_v3_guard.py
