name: Acolad Narrative Visual + Stock + NovinHub READ ONLY PREVIEW

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Persian font and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0
      - name: Free offline safety and text layout tests
        run: python -m unittest discover -s tests -p 'test_acolad_narrative_visual_preview.py' -v
      - name: Render real Acolad background with stock and NovinHub read-only check
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
        run: |
          python acolad_narrative_visual_preview.py --story-json examples/acolad_narrative_v4_visual_preview.json --stock auto --read-only-novinhub
      - name: Upload visual PREVIEW ONLY
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-narrative-visual-stock-novinhub-preview
          path: acolad_narrative_visual_output/
          if-no-files-found: warn
          retention-days: 14
