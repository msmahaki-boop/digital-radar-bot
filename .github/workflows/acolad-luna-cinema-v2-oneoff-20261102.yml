name: Acolad Luna CINEMA V2 One-time Paid PREVIEW (never publish)

on:
  push:
    paths:
      - 'ops/acolad-luna-cinema-oneoff-20261102.trigger'

permissions:
  contents: read

concurrency:
  group: acolad-luna-cinema-v2-once
  cancel-in-progress: false

jobs:
  narrative-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - name: Checkout exactly the triggered commit
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Isolated dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2

      - name: Free regression and source safety tests MUST pass before API spending
        run: python -m unittest discover -s tests -p 'test_acolad_luna_research_preview.py' -v

      - name: One-time AI research and cinematic storyboard PREVIEW ONLY
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python -u acolad_luna_research_preview.py \
            --focus auto \
            --budget-usd 0.012 \
            --approval I_APPROVE_LUNA_RESEARCH_PAID_PREVIEW \
            --gift-confirmation I_CONFIRMED_LIMITED_GIFT_KEY

      - name: Archive preview, sources and QA regardless of editorial status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-luna-cinema-v2-oneoff
          path: acolad_luna_research_preview/
          if-no-files-found: warn
          retention-days: 14
