name: Acolad Story Generator Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Persian font and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate story previews (no publishing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python story_test.py

      - name: Upload story PNGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-story-previews
          path: stories_output/
          if-no-files-found: warn
          retention-days: 7
