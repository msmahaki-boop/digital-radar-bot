name: Acolad Nov8 Instagram Business recovery OFFLINE QA
on:
  push:
    branches: [feature/acolad-nov8-instagram-business-recovery]
    paths: [ops/acolad-nov8-instagram-recovery-offline.trigger]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - run: python -m py_compile acolad_nov8_instagram_business_retry.py
      - run: python -m unittest discover -s tests -p 'test_acolad_nov8_instagram_business_retry.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
