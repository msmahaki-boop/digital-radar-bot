name: Acolad Narrative Director V4 FREE unit tests (one-shot only)

on:
  push:
    paths:
      - 'ops/acolad-narrative-v4-free-test-20261102.trigger'

permissions:
  contents: read

jobs:
  narrative-unit-tests:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Run offline regression tests (no Secrets, no API spending)
        run: python -m unittest discover -s tests -p 'test_acolad_luna_research_preview.py' -v
