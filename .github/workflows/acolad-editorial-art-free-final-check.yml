name: Acolad Editorial V1 FINAL FREE art and evidence gate (never publish)

on:
  push:
    paths:
      - 'ops/acolad-editorial-art-free-final-check.trigger'

permissions:
  contents: read

jobs:
  offline-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safe typography dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - name: Unit tests for evidence, editorial rotation, font and art (no API calls)
        run: |
          python -m unittest discover -s tests -p 'test_acolad_editorial_gate_v1.py' -v
          python -m unittest discover -s tests -p 'test_acolad_daily_editorial_v1.py' -v
          python -m unittest discover -s tests -p 'test_acolad_cinematic_v3.py' -v
      - name: Generate only original zero-cost illustrated panels
        run: |
          python -u acolad_concept_art_pipeline_v2.py \
            --story-json examples/acolad_new_daily_episode_guest_checkout_20261103.json \
            --budget-toman 20000
      - name: Real Acolad frozen IRANSans story images with better concept-matched artwork
        run: |
          python -u acolad_narrative_visual_v2.py \
            --story-json examples/acolad_new_daily_episode_guest_checkout_20261103.json \
            --stock off --output acolad_daily_final_visual_output
      - name: Archive images and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-daily-guest-checkout-final-zero-cost-illustrated
          path: |
            acolad_daily_final_visual_output/
            acolad_concept_assets/
          if-no-files-found: warn
          retention-days: 14
