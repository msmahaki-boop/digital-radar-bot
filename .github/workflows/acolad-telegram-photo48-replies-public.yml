name: Acolad owner-approved source-locked Telegram continuation replies to image #48
on:
  push:
    branches: [main]
    paths: [ops/acolad-nov08-telegram-replies-48.trigger]
permissions:
  contents: read
  actions: read
concurrency:
  group: acolad-v4-one-publish-attempt-at-a-time
  cancel-in-progress: false
jobs:
  two-followups:
    if: contains(github.event.head_commit.message, '[ACOLAD_OWNER_APPROVED_NOV08_TELEGRAM_REPLIES_48]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install source lock and native Bot API dependencies
        run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Restore exactly approved GPT Image story artifact
        uses: actions/download-artifact@v4
        with:
          name: acolad-20261108-gpt25-flare-real-cutouts-7slides
          run-id: 42469966562
          github-token: ${{ github.token }}
          path: .
      - name: Validate story and original image, then GET real Telegram message 48
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
        run: |
          python -u - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from acolad_gpt25_owner_release_preflight import verify_owner_release_artifact
          from acolad_telegram_continue_existing_48 import verify_root_from_provider
          from acolad_novinhub_bridge import token
          day=datetime.now(ZoneInfo("Asia/Tehran")).date()
          verify_owner_release_artifact(day)
          verify_root_from_provider(token(),day)
          print("ACOLAD_TELEGRAM_ROOT48_SAFE_TO_REPLY_NOT_YET_SENT",flush=True)
          PY
      - name: Restore previous no-retry reply intents if any
        uses: actions/cache/restore@v4
        with:
          path: acolad_v4_daily_publication/telegram_replies_to_48.json
          key: acolad-nov08-telegram48-replies-${{ github.run_id }}
          restore-keys: |
            acolad-nov08-telegram48-replies-
      - name: Actually send only Telegram continuation messages as replies to #48
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
        run: python -u acolad_telegram_continue_existing_48.py
      - name: Persist reply intents to block blind retry
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: acolad_v4_daily_publication/telegram_replies_to_48.json
          key: acolad-nov08-telegram48-replies-${{ github.run_id }}
      - name: Preserve Telegram message IDs and partial receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-telegram-48-two-source-locked-replies
          path: acolad_v4_daily_publication/telegram_replies_to_48.json
          retention-days: 14
          if-no-files-found: warn
