name: Acolad malformed selector JSON strictly guarded recovery QA
on:
  push:
    branches: [fix/acolad-luna-plan-json-fallback-20261107]
    paths: [ops/acolad-plan-json-qa.trigger]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - run: python -m py_compile acolad_luna_research_preview.py acolad_v4_hourly_publish.py
      - run: python -m unittest discover -s tests -p 'test_acolad_plan_json_recovery.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_evergreen_gate.py' -v
