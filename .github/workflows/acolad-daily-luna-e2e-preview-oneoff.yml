name: Acolad DAILY Luna genuine topic + REAL AI art E2E (one-off PREVIEW)

on:
  push:
    paths:
      - 'ops/acolad-daily-luna-e2e-oneoff.trigger'

permissions:
  contents: read

jobs:
  source-research-luna-and-art:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install brand rendering dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - name: Test editorial/source/visual safeguards before API
        run: |
          python -m unittest discover -s tests -p 'test_acolad_editorial_gate_v1.py' -v
          python -m unittest discover -s tests -p 'test_acolad_daily_editorial_v1.py' -v
          python -m unittest discover -s tests -p 'test_acolad_narrative_visual_v2.py' -v
      - name: Research real current news and produce NEW Luna story with no fictional evidence
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python -u acolad_daily_editorial_v1.py \
            --mode preview \
            --budget-usd 0.018 \
            --approval APPROVED_DAILY_EDITORIAL_PREVIEW_20000_TOMAN
      - name: Source-aware original AI illustration probe then stable fallback
        run: |
          if [ -s acolad_daily_editorial_output/current_story.json ]; then
            python -u acolad_concept_art_pipeline_v2.py \
              --story-json acolad_daily_editorial_output/current_story.json \
              --allow-pollinations \
              --allow-horde \
              --budget-toman 20000
            python -u acolad_narrative_visual_v2.py \
              --story-json acolad_daily_editorial_output/current_story.json \
              --stock off --output acolad_live_daily_story_output
          else
            echo 'NO VALID STORIED EVIDENCE -- output sources, issues, reasons, no invented claims.'
          fi
      - name: Archive complete current-source evidence, generated texts, pixels and image receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-daily-luna-live-topic-e2e-review-only
          path: |
            acolad_luna_research_preview/
            acolad_daily_editorial_output/
            acolad_live_daily_story_output/
            acolad_concept_assets/
          if-no-files-found: warn
          retention-days: 14
