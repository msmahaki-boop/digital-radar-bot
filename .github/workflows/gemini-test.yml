
name: Test Gemini AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_gemini:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v7

      - name: Test Gemini connection
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 gemini_test.py
