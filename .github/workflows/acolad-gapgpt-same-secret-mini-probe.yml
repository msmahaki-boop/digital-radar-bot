name: Acolad GapGPT Same-Secret Minimal API Probe — no social posting
on:
  push:
    branches: [diagnostic/acolad-gapgpt-recharge-20261107]
    paths: [ops/acolad-gapgpt-key-probe.trigger]
permissions:
  contents: read
jobs:
  tiny-model-request:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Probe one tiny response on SAME secret and classify HTTP error without printing keys
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python - <<'PY'
          import os,json,re
          import requests
          key=os.getenv("GAPGPT_API_KEY","").strip()
          assert len(key)>15, "GAPGPT_SECRET_MISSING_OR_EMPTY"
          endpoint="https://api.gapgpt.app/v1/chat/completions"
          try:
              r=requests.post(endpoint,headers={"Authorization":"Bearer "+key,
                  "Content-Type":"application/json"},json={"model":"gpt-6-luna",
                  "messages":[{"role":"system","content":"Respond with exactly one word."},
                              {"role":"user","content":"Say OK."}],
                  "stream":False,"reasoning_effort":"none","max_tokens":40},timeout=55)
          except requests.RequestException as ex:
              print("SAFE_GAPGPT_PROBE",{"transport":type(ex).__name__})
              raise SystemExit(2)
          outcome={"http":r.status_code,"model":"gpt-6-luna","same_github_secret":True}
          if r.status_code!=200:
              try:
                  data=r.json()
                  err=data.get("error",data) if isinstance(data,dict) else {}
                  msg=str(err.get("message") or err.get("detail") or "") if isinstance(err,dict) else ""
                  code=str(err.get("code") or err.get("type") or "") if isinstance(err,dict) else ""
              except Exception:
                  msg="";code=""
              lower=(msg+" "+code).lower()
              if any(x in lower for x in ["balance","credit","quota","insufficient","billing","payment","余额","موجودی"]):
                  category="CREDIT_OR_QUOTA"
              elif any(x in lower for x in ["key","invalid","forbidden","unauthorized","permission","verify","access","authentication"]):
                  category="KEY_OR_MODEL_ACCESS"
              elif any(x in lower for x in ["model","not found","not available","disabled"]):
                  category="MODEL_NOT_AVAILABLE"
              elif any(x in lower for x in ["rate","limit","frequency"]):
                  category="RATE_LIMIT"
              else:
                  category="HTTP_OTHER_UNCLASSIFIED"
              outcome["error_category"]=category
              outcome["provider_code"]=re.sub(r"[^a-zA-Z0-9_\-]","",code)[:50]
          else:
              outcome["response_valid"] = bool((r.json().get("choices") or []))
          print("SAFE_GAPGPT_PROBE",json.dumps(outcome,ensure_ascii=False))
          if r.status_code!=200:
              raise SystemExit(2)
          PY
