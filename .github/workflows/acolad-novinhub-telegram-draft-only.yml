name: Acolad NovinHub Telegram Draft ONLY (NO PUBLISH)
on:
  push:
    branches: [feature/acolad-gpt2-novinhub-20261104]
    paths: [ops/acolad-novinhub-telegram-draft-only.trigger]
permissions:
  contents: read
jobs:
  telegram-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: One Telegram test draft, no image or public publish
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python acolad_novinhub_telegram_draft_only.py
