name: Acolad V4 Daily Story and NovinHub Telegram Bale Instagram
on:
  schedule:
    - cron: '45 7 * * *'  # 11:15 Tehran, UTC 07:45
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [preview]
        default: preview
        required: true
  push:
    branches: [feature/acolad-v4-autopublish-20261104]
    paths: [ops/acolad-v4-production-preflight.trigger]
permissions:
  contents: read
concurrency:
  group: acolad-v4-daily-all-platforms
  cancel-in-progress: false
jobs:
  verified-narrative:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Persian shaping and image dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - name: Mandatory offline unit tests before any paid API call
        run: |
          python -m py_compile acolad_v4_daily_autopublish.py acolad_daily_editorial_v1.py acolad_luna_research_preview.py acolad_narrative_visual_v2.py
          python -m unittest discover -s tests -p 'test_acolad_v4_autopublish.py' -v
      - name: Restore source duplicate history
        uses: actions/cache/restore@v4
        with:
          path: acolad_daily_editorial_history.json
          key: acolad-v4-history-${{ github.run_id }}
          restore-keys: |
            acolad-v4-history-
            acolad-daily-verified-story-history-
      - name: Generate original-source story and schedule in NovinHub only after safe approval
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
          ACOLAD_AUTOPUBLISH_APPROVAL: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && 'APPROVED_AUTO_PUBLISH_ALL_THREE_20261104' || 'PREVIEW_ONLY' }}
          RUN_MODE: ${{ github.event_name == 'schedule' && github.ref == 'refs/heads/main' && 'auto' || 'preview' }}
        run: python -u acolad_v4_daily_autopublish.py --mode "$RUN_MODE"
      - name: Save fresh source history
        if: success()
        uses: actions/cache/save@v4
        with:
          path: acolad_daily_editorial_history.json
          key: acolad-v4-history-${{ github.run_id }}
      - name: Preserve provider receipts and rendered frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-v4-publication-report
          path: |
            acolad_v4_daily_publication/
            acolad_daily_editorial_output/preview_status.json
            acolad_luna_research_preview/status.json
          retention-days: 14
          if-no-files-found: warn
