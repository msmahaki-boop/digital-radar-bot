name: Acolad Gemini Lite Nov7 prepublication PREVIEW ONLY (NO SOCIAL)
on:
  push:
    branches: [fix/acolad-gemini-lite-recovery-20261107]
    paths: [ops/acolad-gemini-lite-preview.trigger]
permissions:
  contents: read
  actions: read
jobs:
  build-preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install image typography and Python dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - name: Reject old archived research and discover FRESH dated first-party evidence
        run: |
          echo "day=$(TZ=Asia/Tehran date +%F)" >> "$GITHUB_ENV"
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import acolad_v4_hourly_publish as publisher
          from pathlib import Path
          assert not Path(publisher.EDITORIAL_CACHE).exists(), "Unexpected old restored cache"
          print("PREVIEW_FRESH_SOURCE_REQUIRED",datetime.now(ZoneInfo("Asia/Tehran")).date().isoformat())
          PY
      - name: Generate preview-only text, critics and art (NO NOVINHUB TOKEN)
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import acolad_v4_hourly_publish as p
          from pathlib import Path
          day=datetime.now(ZoneInfo("Asia/Tehran")).date()
          import json
          x=p.prepare(day)
          evidence=json.loads(p.EDITORIAL_CACHE.read_text(encoding="utf8")).get("evidence",[]) if p.EDITORIAL_CACHE.exists() else []
          print("PREVIEW_SOURCE_DATES",{"today_tehran":day.isoformat(),"dates":[e.get("date") for e in evidence]},flush=True)
          if x is None:raise RuntimeError("EDITORIAL_VETO_NO_PREVIEW")
          document,frames=x
          assert document["validated"] is True
          assert set(document["captions"])==set(p.NETWORKS)
          assert len(frames)>=6
          for img in frames:assert Path(img).is_file()
          print("PREVIEW_PASSED_ONLY", {"day":day.isoformat(),"frames":len(frames),"critic_count":len(document["critics"]),"network_copies":list(document["captions"]),"public_posts_created":0},flush=True)
          PY
      - name: Report fresh source discovery and publication gates (read-only diagnostics)
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('acolad_luna_research_preview/status.json')
          if p.exists():
              x=json.loads(p.read_text(encoding='utf8'))
              print('FRESH_DISCOVERY_STATUS',json.dumps({'status':x.get('status'),
                'candidates':x.get('source_candidates'),'issues':x.get('issues'),
                'diagnostics':x.get('research_diagnostics')},ensure_ascii=False))
          q=Path('acolad_luna_research_preview/sources_all.json')
          if q.exists():
              x=json.loads(q.read_text(encoding='utf8'))
              print('CURRENT_SOURCE_SHORTLIST',json.dumps([{'date':a.get('date'),
                'publisher':a.get('publisher'),'title':a.get('title'),
                'evidence_depth':a.get('evidence_depth'),'type':a.get('source_type')}
                for a in x[:15]],ensure_ascii=False))
          PY
      - name: Keep private preview artwork and captions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-gemini-lite-preview-20261107
          path: |
            acolad_v4_daily_publication/
            acolad_daily_editorial_output/preview_status.json
            acolad_luna_research_preview/status.json
            acolad_luna_research_preview/selected_evidence.json
          retention-days: 7
          if-no-files-found: warn
