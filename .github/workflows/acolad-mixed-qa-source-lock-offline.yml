name: Acolad mixed numeric/structure V4 gate tests — NO SOCIAL
on:
  push:
    branches: [fix/acolad-gemini-source-locked-mixed-qa-20261107]
    paths: [ops/acolad-mixed-qa-safety-check.trigger]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - name: Compile and test all strict source-locked mixed recovery policies
        run: |
          python -m py_compile acolad_mixed_qa_recovery.py acolad_luna_research_preview.py acolad_v4_hourly_publish.py
          python -m unittest discover -s tests -p 'test_acolad_mixed_qa_source_lock.py' -v
          python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
