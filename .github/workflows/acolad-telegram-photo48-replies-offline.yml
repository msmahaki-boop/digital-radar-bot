name: Acolad Telegram photo #48 reply-thread OFFLINE QA
on:
  push:
    branches: [feature/acolad-20261108-telegram-reply-to-image-48]
    paths: [ops/acolad-telegram-reply-48-offline.trigger]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - run: python -m py_compile acolad_telegram_continue_existing_48.py
      - run: python -m unittest discover -s tests -p 'test_acolad_telegram_continue_existing_48.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_native_story_threads.py' -v
