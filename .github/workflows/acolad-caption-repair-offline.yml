name: Acolad channel-only copy repair regression NO NETWORK
on:
  push:
    branches: [fix/acolad-per-channel-caption-repair-20261107]
    paths: [ops/acolad-caption-repair-qa.trigger]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - run: python -m py_compile acolad_v4_daily_autopublish.py acolad_v4_hourly_publish.py
      - run: python -m unittest discover -s tests -p 'test_acolad_caption_repair.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
