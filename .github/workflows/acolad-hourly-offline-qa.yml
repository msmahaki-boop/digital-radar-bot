name: Acolad Hourly Immediate Publish QA - OFFLINE (NO API)
on:
  push:
    branches: [fix/acolad-hourly-until-published-20261107]
    paths: [ops/acolad-hourly-offline-qa.trigger]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - run: python -m py_compile acolad_v4_hourly_publish.py acolad_v4_daily_autopublish.py acolad_daily_editorial_v1.py
      - run: python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_v4_autopublish.py' -v
