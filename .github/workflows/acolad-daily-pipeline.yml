name: Acolad Daily Story Pipeline V2.8

# Schedule 16:30 in Tehran (13:00 UTC); publication occurs at 18:00 Tehran via Buffer.
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (no upload), draft (Buffer draft), queue (publish to Buffer)'
        required: true
        type: choice
        default: queue
        options:
          - queue
          - draft
          - preview
      queue_approval:
        description: 'For QUEUE mode ONLY, type QUEUE_APPROVED'
        required: false
        type: string
        default: 'QUEUE_APPROVED'

permissions:
  contents: read

concurrency:
  group: acolad-daily-stories
  cancel-in-progress: false

jobs:
  daily-story:
    if: ${{ vars.ACOLAD_AUTOPUBLISH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Persian fallback font and packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Generate, validate and optionally send to Buffer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          ACOLAD_MAX_AGE_HOURS: '48'
          ACOLAD_REQUIRE_DATED_NEWS: '0'
          PIPELINE_MODE: ${{ github.event_name == 'schedule' && 'queue' || inputs.mode || 'queue' }}
          QUEUE_APPROVAL: ${{ github.event_name == 'schedule' && 'QUEUE_APPROVED' || inputs.queue_approval || 'QUEUE_APPROVED' }}
        run: python daily_story_pipeline.py --mode "${PIPELINE_MODE:-queue}" --approval "${QUEUE_APPROVAL:-QUEUE_APPROVED}"

      - name: Upload previews and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-daily-preview-${{ github.run_number }}
          path: stories_output/
          if-no-files-found: warn
          retention-days: 7
