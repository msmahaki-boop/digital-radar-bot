name: Acolad Daily Story Pipeline V2.8

# RELIABLE-RETRY V4.6: Every hour, at :11 Tehran, until Buffer holds
# the day's story batch. This is a best-effort poller, NOT a guarantee
# that GitHub starts every cron event. All cron values are in UTC.
# A queued or sent batch exits before image generation, so repeats are cheap.
# If 18:00 Tehran has passed, schedule the batch for a safe future time.
# Original Buffer workflow remains available for manual rollback only.
# NovinHub becomes the sole scheduled Instagram provider after merge.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview (no upload), draft (Buffer draft), queue (auto-schedule any time today)'
        required: true
        type: choice
        default: preview
        options:
          - preview
          - draft
          - queue
      queue_approval:
        description: 'For QUEUE mode ONLY, type QUEUE_APPROVED'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: acolad-daily-stories
  cancel-in-progress: false

jobs:
  daily-story:
    if: ${{ github.event_name != 'schedule' || vars.ACOLAD_AUTOPUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Persian fallback font and packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Generate, validate and optionally send to Buffer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          ACOLAD_MAX_AGE_HOURS: '48'
          ACOLAD_REQUIRE_DATED_NEWS: '1'
          PIPELINE_MODE: ${{ github.event_name == 'schedule' && 'queue' || inputs.mode || 'preview' }}
          QUEUE_APPROVAL: ${{ github.event_name == 'schedule' && 'QUEUE_APPROVED' || inputs.queue_approval }}
        run: python daily_story_pipeline.py --mode "${PIPELINE_MODE:-preview}" --approval "$QUEUE_APPROVAL"
      - name: Upload previews and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-daily-preview-${{ github.run_number }}
          path: stories_output/
          if-no-files-found: warn
          retention-days: 7
