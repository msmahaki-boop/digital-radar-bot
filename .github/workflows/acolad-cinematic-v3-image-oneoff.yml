name: Acolad V3 Centered Typography + ONE Budgeted Concept Image (PREVIEW ONLY)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: 'Explicit paid image test approval; one image, max 20000 toman planning budget'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: acolad-concept-one-paid-image-v3
  cancel-in-progress: false

jobs:
  image-and-visual-preview:
    if: github.ref == 'refs/heads/main' && inputs.approval == 'USER_APPROVED_ONE_IMAGE_20000_TOMAN'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persian typography and safe dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0
      - name: Offline QA before any paid request (7+ regressions)
        run: |
          python -m unittest discover -s tests -p 'test_acolad_cinematic_v3.py' -v
          python -m unittest discover -s tests -p 'test_acolad_narrative_visual_v2.py' -v
      - name: Image API single-request probe with explicit 20000 toman soft budget
        continue-on-error: true
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python acolad_concept_image_gapgpt_preview.py \
            --scene 2 \
            --budget-usd 0.08 \
            --approval USER_APPROVED_ONE_IMAGE_20000_TOMAN
      - name: Re-render full Acolad series with original IRANSans and concept image if delivered
        run: |
          python acolad_narrative_visual_v2.py \
            --story-json examples/acolad_narrative_v2_fixed_demo.json \
            --stock off \
            --output acolad_cinematic_v3_output
      - name: Archive screenshots and sanitized API status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-cinematic-v3-center-highlight-concept
          path: |
            acolad_cinematic_v3_output/
            acolad_concept_assets/
          retention-days: 14
          if-no-files-found: warn
