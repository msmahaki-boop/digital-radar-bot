name: Acolad Telegram 7 Topics V4 PREVIEW

on:
  workflow_dispatch:
    inputs:
      slot_hour:
        description: '0 tech, 3 ai, 6 economy, 9 marketing, 12 small-business, 15 platforms, 18 social, 21 best-of-day'
        required: true
        default: '6'
        type: choice
        options: ['0', '3', '6', '9', '12', '15', '18', '21']

permissions:
  contents: read

concurrency:
  group: acolad-telegram-seven-topics-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Run tests without Telegram API
        run: python -m unittest discover -s tests -p 'test_telegram_v4.py' -v
      - name: Rank news and prepare single preview (no publish)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python telegram_daily_v4.py --phase prepare --mode preview --slot-hour '${{ inputs.slot_hour }}'
      - name: Upload preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-telegram-seven-topics-preview-${{ github.run_number }}
          path: telegram_daily_output/
          if-no-files-found: warn
          retention-days: 7
