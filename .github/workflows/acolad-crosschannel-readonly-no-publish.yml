name: Acolad Cross-channel NovinHub Telegram Buffer READ ONLY (NO PUBLISH)
on:
  push:
    branches: [feature/acolad-gpt2-novinhub-20261104]
    paths:
      - ops/acolad-crosschannel-readonly-20261104.trigger
permissions:
  contents: read
jobs:
  crosschannel-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Check preflight tests OFFLINE
        run: python -m unittest discover -s tests -p 'test_acolad_crosschannel_preflight.py' -v
      - name: Read-only LIVE NovinHub accounts, Buffer today and Telegram receipt
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python acolad_crosschannel_preflight.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-crosschannel-safe-status
          path: acolad_crosschannel_health/status.json
          retention-days: 7
          if-no-files-found: warn
