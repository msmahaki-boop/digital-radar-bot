name: Acolad NovinHub 7 second rate guard OFFLINE QA
on:
  push:
    branches: [fix/acolad-nov8-novinhub-rate-limit-guard]
    paths: [ops/acolad-nov8-rate-guard-qa.trigger]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - run: python -m py_compile acolad_v4_hourly_publish.py
      - run: python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_social_platform_footers.py' -v
