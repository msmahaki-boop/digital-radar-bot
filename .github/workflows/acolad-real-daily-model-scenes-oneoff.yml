name: Acolad Daily Real AI Multi-scene Artwork End-to-End QA (NO PUBLISH)
on:
  push:
    paths:
      - 'ops/acolad-real-daily-model-scenes-oneoff.trigger'
permissions:
  contents: read
jobs:
  prove-daily-model-scene-art:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install fonts and real CPU inference weights
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check diffusers==0.35.2 transformers==4.51.3 accelerate==1.7.0 huggingface_hub==0.35.3 safetensors==0.6.2 Pillow==11.3.0 requests==2.32.5
      - name: Genuine different AI concepts for several narrative scenes
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '8'
        run: |
          python -u acolad_daily_ai_ink_stories_v1.py \
            --story-json examples/acolad_new_daily_episode_guest_checkout_20261103.json \
            --output acolad_concept_assets
      - name: Render Acolad IRANSans story with genuinely different scene concepts
        run: |
          python -u acolad_narrative_visual_v2.py \
            --story-json examples/acolad_new_daily_episode_guest_checkout_20261103.json \
            --stock off --output acolad_model_daily_multiscene_visual
      - name: Preserve provenance and actual images for editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-daily-multiscene-real-ai-ink-image-qa
          path: |
            acolad_concept_assets/
            acolad_model_daily_multiscene_visual/
          if-no-files-found: warn
          retention-days: 14
