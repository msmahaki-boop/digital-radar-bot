name: Acolad indexed DOI original abstract quality gate (NO NETWORK)
on:
  push:
    branches: [fix/acolad-scholarly-abstract-fallback-20261107]
    paths: [ops/acolad-doi-abstract-qa.trigger]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - run: python -m py_compile acolad_luna_research_preview.py acolad_v4_hourly_publish.py
      - run: python -m unittest discover -s tests -p 'test_acolad_doi_abstract_qa.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_plan_json_recovery.py' -v
