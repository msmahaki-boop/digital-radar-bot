name: Acolad GapGPT Qwen Original Image One-off (NO PUBLISH)
on:
  push:
    branches: [fix/acolad-image-provider-qa-20261104]
    paths:
      - ops/acolad-qwen-catalog-20261104.trigger
      - ops/acolad-qwen-generate-20261104.trigger
permissions:
  contents: read
concurrency:
  group: acolad-qwen-oneoff-20261104
  cancel-in-progress: false
jobs:
  qwen-catalog:
    if: contains(github.event.head_commit.message, '[QWEN_PREFLIGHT]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Run mocked tests - never bill
        run: python -m unittest discover -s tests -p test_acolad_gapgpt_qwen_image_once.py -v
      - name: Check connected GapGPT key and available models - GET only
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: python acolad_gapgpt_qwen_image_once.py --mode preflight
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-qwen-model-catalog-safe-report
          path: acolad_gapgpt_qwen_preview/status.json
          retention-days: 7
  qwen-one-image:
    if: contains(github.event.head_commit.message, '[QWEN_ONE_IMAGE_APPROVED]')
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Mocked tests before billable request
        run: python -m unittest discover -s tests -p test_acolad_gapgpt_qwen_image_once.py -v
      - name: ONE GapGPT Qwen image only - NEVER publish
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
        run: |
          python acolad_gapgpt_qwen_image_once.py --mode generate --approval GAPGPT_QWEN_ONE_IMAGE_20000_TOMAN_APPROVED
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-qwen-real-image-preview-and-receipt
          path: acolad_gapgpt_qwen_preview/
          retention-days: 7
