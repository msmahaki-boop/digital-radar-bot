name: Acolad Luna Live Research and Story PREVIEW (manual-only)

on:
  workflow_dispatch:
    inputs:
      focus:
        description: 'auto chooses a high-impact theme; or select a domain'
        type: choice
        default: auto
        required: true
        options:
          - auto
          - iran_economy
          - iran_platforms
          - marketing
          - tech
      budget_usd:
        description: 'Soft estimate gate; 0.02 USD = 5000 toman at 250000/USD; NOT provider hard limit'
        type: string
        default: '0.02'
        required: true
      approval:
        description: 'To permit 1-3 potentially paid Luna calls: I_APPROVE_LUNA_RESEARCH_PAID_PREVIEW'
        type: string
        required: true
      gift_confirmation:
        description: 'Only after checking limited gift key: I_CONFIRMED_LIMITED_GIFT_KEY'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: acolad-luna-research-preview-only
  cancel-in-progress: false

jobs:
  independent-research-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated source-read dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2
      - name: Internal safety regression checks
        run: python -m unittest discover -s tests -p 'test_acolad_luna_research_preview.py' -v
      - name: Research current public sources and create Luna PREVIEW ONLY
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          ACOLAD_FOCUS: ${{ inputs.focus }}
          ACOLAD_BUDGET: ${{ inputs.budget_usd }}
          ACOLAD_APPROVAL: ${{ inputs.approval }}
          ACOLAD_GIFT: ${{ inputs.gift_confirmation }}
        run: |
          python -u acolad_luna_research_preview.py \
            --focus "$ACOLAD_FOCUS" \
            --budget-usd "$ACOLAD_BUDGET" \
            --approval "$ACOLAD_APPROVAL" \
            --gift-confirmation "$ACOLAD_GIFT"
      - name: Export research, sources, text, and preview (never uploads content to social media)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-luna-live-research-preview
          path: acolad_luna_research_preview/
          if-no-files-found: warn
          retention-days: 14
