name: Acolad Today Bale Short Sourced Narrative Draft (NO PUBLISH)
on:
  push:
    branches: [feature/acolad-narrative-novinhub-20261104]
    paths: [ops/acolad-bale-full-narrative-short-draft.trigger]
permissions:
  contents: read
  actions: read
jobs:
  short-bale:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: acolad-2026-11-04-new-narrative-today-preview-no-publish
          run-id: 41811643422
          github-token: ${{ github.token }}
      - run: pip install requests==2.32.5 Pillow==11.3.0
      - env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python acolad_today_bale_short_draft.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-today-bale-narrative-short-draft
          path: acolad_bale_narrative_draft/
          retention-days: 14
