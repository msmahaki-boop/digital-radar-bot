name: Acolad Guest V4 - Same Nine Images to NovinHub INSTAGRAM DRAFT ONLY
on:
  push:
    branches: [feature/acolad-guest-checkout-v4-preview-20261104]
    paths:
      - assets/reviews/Acolad_Guest_Checkout_V4_Preview_20261104.zip
permissions:
  contents: read
concurrency:
  group: acolad-guest-v4-exact-ig-draft
  cancel-in-progress: false
jobs:
  exact-ig-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image integrity and API dependencies
        run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Verify package SHA and create only one review-only NovinHub IG draft
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python -u acolad_guest_checkout_instagram_exact_zip.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-guest-v4-ig-exact-draft-receipt
          path: acolad_guest_checkout_instagram_draft_receipt/status.json
          retention-days: 14
          if-no-files-found: warn
