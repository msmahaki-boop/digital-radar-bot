
name: Digital Radar News

on:
  workflow_dispatch:
    inputs:
      preview:
        description: 'Test AI with latest news (does not update history)'
        type: boolean
        default: true
        required: false

  schedule:
    - cron: '37 5,11,17 * * *'

permissions:
  contents: write

concurrency:
  group: digital-radar-updates
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Fetch, analyze and send news
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIEW_MODE: ${{ inputs.preview }}
        run: python3 bot.py

      - name: Save sent-news history
        if: ${{ github.event_name == 'schedule' || !inputs.preview }}
        run: |
          if [ -f sent_news.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add sent_news.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update sent news history'
              git push origin HEAD:main
            fi
          fi
