name: Acolad TRUE Image AI Guided by Original Minimal Ink Drawing — CPU Only

on:
  push:
    paths:
      - 'ops/acolad-original-ink-img2img-once.trigger'

permissions:
  contents: read

jobs:
  grounded-ink-model:
    runs-on: ubuntu-latest
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: CPU torch plus real open-license diffusion
        run: |
          python -m pip install --disable-pip-version-check --quiet torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --quiet diffusers==0.35.2 transformers==4.51.3 accelerate==1.7.0 huggingface_hub==0.35.3 safetensors==0.6.2 Pillow==11.3.0 requests==2.32.5
      - name: Original Acolad seed sketch conditioned by real diffusion image model
        env:
          HF_HUB_DISABLE_XET: '1'
          HF_HUB_DISABLE_TELEMETRY: '1'
          OMP_NUM_THREADS: '8'
        run: |
          python -u acolad_original_ink_img2img_cpu_v1.py \
            --output acolad_original_ink_img2img_output
      - name: Archive exact source concept, image model result and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-original-ink-guided-genuine-diffusion
          path: acolad_original_ink_img2img_output/
          if-no-files-found: warn
          retention-days: 14
