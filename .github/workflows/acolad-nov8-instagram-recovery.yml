name: Acolad Nov8 Instagram Business recovery ONLY (hourly, verified GPT Image)
on:
  schedule:
    - cron: '40 5-19 * * *' # 09:10..23:10 Tehran; date-gated Nov8 only
  push:
    branches: [main]
    paths: [ops/acolad-nov8-instagram-recovery.trigger]
permissions:
  contents: read
  actions: read
concurrency:
  group: acolad-v4-one-publish-attempt-at-a-time
  cancel-in-progress: false
jobs:
  instagram-only:
    if: false # retired: owner replaced V4 story with redesigned V5, never replay Nov8 artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Restore the exact source-vetted original GPT2.5 image story
        uses: actions/download-artifact@v4
        with:
          name: acolad-20261108-gpt25-flare-real-cutouts-7slides
          run-id: 42469966562
          github-token: ${{ github.token }}
          path: .
      - name: Restore prior request's ambiguous or accepted receipt intent
        uses: actions/cache/restore@v4
        with:
          path: acolad_v4_daily_publication/instagram_nov8_retry_intent.json
          key: acolad-nov8-instagram-retry-${{ github.run_id }}
          restore-keys: |
            acolad-nov8-instagram-retry-
      - name: Only Instagram NovinHub Story POST if today, real AI, source/critics passed and missing
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
          ACOLAD_REQUIRE_REAL_GPT25_ART: '1'
        run: python -u acolad_nov8_instagram_business_retry.py
      - name: Preserve recovery intent even after provider HTTP errors
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: acolad_v4_daily_publication/instagram_nov8_retry_intent.json
          key: acolad-nov8-instagram-retry-${{ github.run_id }}
      - name: Keep factual Instagram provider status (never equate green with published)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-nov8-instagram-business-only-recovery-receipt
          path: |
            acolad_v4_daily_publication/instagram_nov8_retry_status.json
            acolad_v4_daily_publication/instagram_nov8_retry_intent.json
          if-no-files-found: warn
          retention-days: 14
