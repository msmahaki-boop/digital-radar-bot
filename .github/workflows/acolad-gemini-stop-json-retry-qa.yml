name: Acolad Gemini STOP malformed JSON retry regression NO SOCIAL
on:
  push:
    branches: [fix/acolad-gemini-stop-json-retry-20261107]
    paths: [ops/acolad-gemini-stop-json-test.trigger]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - run: python -m py_compile acolad_model_gemini_failover.py acolad_luna_research_preview.py
      - run: python -m unittest discover -s tests -p 'test_acolad_gemini_stop_json_retry.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_mixed_qa_source_lock.py' -v
