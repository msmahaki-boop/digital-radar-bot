name: Acolad New Topics Gemini Editorial Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editorial-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requests
        run: python -m pip install --disable-pip-version-check requests
      - name: Screen sources and rank with Gemini - NO PUBLICATION
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_GEMINI_MODEL: ${{ vars.STORY_GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          STORY_GEMINI_FALLBACK_MODEL: ${{ vars.STORY_GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python acolad_editorial_preview.py
      - name: Download editorial review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-editorial-review-preview
          path: acolad_editorial_preview_report/
          if-no-files-found: warn
