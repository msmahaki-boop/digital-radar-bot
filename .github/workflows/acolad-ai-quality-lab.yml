name: Acolad AI Quality Lab (manual only)

on:
  workflow_dispatch:
    inputs:
      samples:
        description: "1=quick connection check; 2=fuller editorial comparison"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"

permissions:
  contents: read

jobs:
  editorial-quality-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run editorial quality lab (NEVER publishes)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ACOLAD_GEMINI_MODEL: ${{ vars.ACOLAD_GEMINI_MODEL }}
          ACOLAD_OPENROUTER_MODELS: ${{ vars.ACOLAD_OPENROUTER_MODELS }}
        run: python -u acolad_ai_benchmark.py --cases "${{ inputs.samples }}"
      - name: Upload readable report, diagnostic status and answer key
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-ai-quality-results-v2
          path: ai_benchmark_results/
          if-no-files-found: warn
          retention-days: 14
