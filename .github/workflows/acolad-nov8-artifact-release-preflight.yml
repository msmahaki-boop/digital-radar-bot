name: Acolad Nov8 REAL GPT2.5 artifact pre-PUBLISH QA (NO SOCIAL)
on:
  push:
    branches: [feature/acolad-nov8-source-locked-gpt25-release]
    paths: [ops/acolad-nov8-artifact-release-preflight.trigger]
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install quality validation dependencies
        run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Restore exact approved fresh eight-frame preview with true AI assets
        uses: actions/download-artifact@v4
        with:
          name: acolad-20261108-gpt25-flare-real-cutouts-7slides
          run-id: 42469966562
          github-token: ${{ github.token }}
          path: .
      - name: Verify source, two critics, full true alpha and each channel signature
        run: |
          python -m unittest discover -s tests -p 'test_acolad_owner_release_preflight.py' -v
          python -u acolad_gpt25_owner_release_preflight.py
      - name: Archive normalized owner-safe preview, never post
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-20261108-real-ai-verified-prepublication-only
          path: |
            acolad_v4_daily_publication/owner_release_preflight.json
            acolad_v4_daily_publication/hourly_ready.json
          if-no-files-found: warn
          retention-days: 14
