name: Acolad GapGPT CONNECTIVITY diagnostic (no tokens, no paid API)

on:
  push:
    paths:
      - 'ops/acolad-gapgpt-connectivity-diagnostic-20261102.trigger'

permissions:
  contents: read

jobs:
  free-network-diagnostic:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check DNS, TCP, TLS and public GapGPT paths (NO API KEY)
        run: |
          python - <<'PY'
          import socket,ssl,urllib.request,urllib.error,time
          host='api.gapgpt.app'
          for name,fn in [
              ('dns',lambda: sorted({x[4][0] for x in socket.getaddrinfo(host,443,proto=socket.IPPROTO_TCP)})),
              ('tcp',lambda: socket.create_connection((host,443),timeout=7)),
          ]:
              t=time.monotonic()
              try:
                  result=fn()
                  if name=='tcp':result.close();result='CONNECTED'
                  print(name,'PASS',str(result)[:200],round(time.monotonic()-t,2))
              except Exception as ex:
                  print(name,'FAIL',type(ex).__name__,str(ex)[:150])
          for url in ('https://api.gapgpt.app/','https://api.gapgpt.app/v1/models',
                      'https://api.gapgpt.app/v1/chat/completions'):
              t=time.monotonic()
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'AcoladFreeConnectivityDiagnostic/1'})
                  with urllib.request.urlopen(req,timeout=9) as res:
                      print('GET',url,'REACHABLE_HTTP',res.status,round(time.monotonic()-t,2))
              except urllib.error.HTTPError as ex:
                  print('GET',url,'REACHABLE_HTTP',ex.code,round(time.monotonic()-t,2))
              except Exception as ex:
                  print('GET',url,'NETWORK_FAIL',type(ex).__name__,str(ex)[:160],
                        round(time.monotonic()-t,2))
          print('FINISHED. No secret, no paid model API request, no publication.')
          PY
