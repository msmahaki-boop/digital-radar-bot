name: Acolad NovinHub File Response Schema READ ONLY
on:
  push:
    branches: [feature/acolad-gpt2-novinhub-20261104]
    paths: [ops/acolad-novinhub-file-readonly-probe.trigger]
permissions:
  contents: read
jobs:
  file-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0
      - name: Get file manager listing without writes or PII
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python acolad_novinhub_file_schema_probe.py
