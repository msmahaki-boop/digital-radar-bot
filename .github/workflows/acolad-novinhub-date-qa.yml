name: Acolad NovinHub receipt and Bale regression QA NO SOCIAL
on:
  push:
    branches: [fix/acolad-novinhub-bale-date-20261107]
    paths: [ops/acolad-novinhub-date-qa.trigger]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 beautifulsoup4==4.14.2 Pillow==11.3.0
      - run: python -m py_compile acolad_v4_hourly_publish.py acolad_novinhub_bridge.py
      - run: python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
      - run: python -m unittest discover -s tests -p 'test_acolad_verified_checkpoint.py' -v
