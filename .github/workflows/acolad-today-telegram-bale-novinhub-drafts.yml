name: Acolad Today REAL Narrative Telegram + Bale NovinHub Drafts (NO PUBLISH)
on:
  push:
    branches: [feature/acolad-narrative-novinhub-20261104]
    paths: [ops/acolad-narrative-telegram-bale-draft.trigger]
permissions:
  contents: read
  actions: read
jobs:
  two-narrative-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: acolad-2026-11-04-new-narrative-today-preview-no-publish
          run-id: 41811643422
          github-token: ${{ github.token }}
      - run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Create true text narrative drafts for Telegram and Bale (not scheduled)
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python acolad_today_telegram_bale_drafts.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-today-telegram-bale-narrative-draft-text-and-receipts
          path: acolad_today_omnichannel_drafts/
          retention-days: 14
          if-no-files-found: warn
