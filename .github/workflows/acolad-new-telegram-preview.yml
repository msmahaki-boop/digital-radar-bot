name: Acolad 3 New Topics Telegram Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-only:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install --disable-pip-version-check requests
      - name: Unit test duplicate and evergreen guards
        run: python -m unittest discover -s tests -p 'test_acolad_bridge.py'
      - name: Generate current three-topic editorial review (no publishing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_GEMINI_MODEL: ${{ vars.STORY_GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          STORY_GEMINI_FALLBACK_MODEL: ${{ vars.STORY_GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python acolad_editorial_preview.py
      - name: Build independent Telegram caption previews for new topics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STORY_GEMINI_MODEL: ${{ vars.STORY_GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          STORY_GEMINI_FALLBACK_MODEL: ${{ vars.STORY_GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
        run: python acolad_new_telegram_preview.py
      - name: Upload human review previews, never publish
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-new-telegram-captions-${{ github.run_number }}
          path: |
            acolad_new_telegram_preview/
            acolad_editorial_preview_report/editorial_review.md
          retention-days: 7
          if-no-files-found: warn
