name: Acolad V5 owner-approved nine-frame REAL GPT Image publish ONCE
on:
  push:
    branches: [main]
    paths: [ops/acolad-v5-owner-approved-release.trigger]
permissions:
  contents: read
  actions: read
concurrency:
  group: acolad-v4-one-publish-attempt-at-a-time
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[ACOLAD_OWNER_APPROVED_V5_20261108_REAL_PUBLISH]')
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install preview and safe publication dependencies
        run: python -m pip install requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Download exactly the independent-critic-approved ORIGINAL GPT Image V5 preview
        uses: actions/download-artifact@v4
        with:
          name: acolad-human-v5-nine-frames-original-gpt-art-social-cover-preview
          run-id: 00000000000
          github-token: ${{ github.token }}
          path: .
      - name: Validate source, 9 beats, critics >=85, 2 genuine cutouts, square cover and nine story frames
        run: |
          python -m py_compile acolad_human_story_v5.py acolad_v5_visual.py acolad_v5_publication.py
          python -u - <<'PY'
          from acolad_v5_publication import validate_immutable_preview
          story,cover,frames=validate_immutable_preview()
          print('ACOLAD_V5_PRE_PUBLICATION_GATES_PASSED',len(story['slides']),len(frames),cover.name,flush=True)
          PY
      - name: Restore durable no-blind-retry intents from any previous run of same V5 story
        uses: actions/cache/restore@v4
        with:
          path: acolad_human_story_v5_output/v5_publication_intents.json
          key: acolad-v5-baymard-returns-intents-${{ github.run_id }}
          restore-keys: |
            acolad-v5-baymard-returns-intents-
      - name: REAL sends ONLY: Instagram nine story frames; Telegram square cover plus two native replies; Bale native or provider three acts
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          BALE_BOT_TOKEN: ${{ secrets.BALE_BOT_TOKEN }}
          BALE_CHANNEL_ID: ${{ vars.BALE_CHANNEL_ID }}
        run: python -u acolad_v5_publication.py
      - name: Persist intents for idempotency even if provider timed out
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: acolad_human_story_v5_output/v5_publication_intents.json
          key: acolad-v5-baymard-returns-intents-${{ github.run_id }}
      - name: Preserve only true remote message IDs and provider group statuses; green check is not Published
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-human-v5-verified-network-receipts
          path: |
            acolad_human_story_v5_output/v5_publication_intents.json
            acolad_human_story_v5_output/v5_publication_receipts.json
          retention-days: 21
          if-no-files-found: warn
