name: Acolad NovinHub Bale ONE Draft Validation (NO PUBLISH)
on:
  push:
    branches: [feature/acolad-narrative-novinhub-20261104]
    paths: [ops/acolad-bale-draft-diagnostic.trigger]
permissions:
  contents: read
jobs:
  bale:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==11.3.0
      - env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python acolad_novinhub_bale_draft_diagnostic.py
