name: Acolad Nov8 fresh editorial + real GPT2.5 transparent story PREVIEW ONLY
on:
  push:
    branches: [feature/acolad-gapgpt-transparent-gptimage-20261107]
    paths: [ops/acolad-gpt25-fresh-preview.trigger]
permissions:
  contents: read
concurrency:
  group: acolad-nov8-real-image-preview
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install RTL fonts and image/source dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: Offline alpha, strict provenance and editorial regressions
        run: |
          python -m py_compile acolad_v4_hourly_publish.py acolad_v4_daily_autopublish.py acolad_gapgpt_transparent_art.py acolad_gpt25_strict_renderer.py
          python -m unittest discover -s tests -p 'test_acolad_gapgpt_transparent_art.py' -v
          python -m unittest discover -s tests -p 'test_acolad_gpt25_strict_renderer.py' -v
          python -m unittest discover -s tests -p 'test_acolad_v4_hourly.py' -v
          python -m unittest discover -s tests -p 'test_acolad_voice_narrow_passive_repair.py' -v
      - name: Fresh PRIMARY-EVIDENCE editorial + two independent critics + ORIGINAL GPT Image 2.5 cutouts and seven RTL frames
        env:
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ACOLAD_REQUIRE_REAL_GPT25_ART: '1'
        run: |
          python -u - <<'PY'
          import json
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from acolad_v4_hourly_publish import prepare, existing_bundle, check_verified_editorial
          from pathlib import Path
          now=datetime.now(ZoneInfo("Asia/Tehran"))
          print("ACOLAD_FRESH_AI_PREVIEW_DATE",now.date().isoformat(),flush=True)
          day=now.date()
          if day.isoformat() != "2026-11-08":
              raise RuntimeError("DATE_SCOPED_PREVIEW_REQUIRES_NEW_EDITORIAL_DAY")
          prepared=prepare(day)
          if not prepared:raise RuntimeError("FRESH_EDITORIAL_OR_CRITIC_VETO")
          ready,frames=existing_bundle(day)
          story=json.loads(Path("acolad_v4_daily_publication/story.json").read_text(encoding="utf8"))
          evidence=json.loads(Path("acolad_v4_daily_publication/sources_private.json").read_text(encoding="utf8"))
          check_verified_editorial(story,evidence)
          proof=json.loads(Path("acolad_v4_daily_publication/image_provenance.json").read_text(encoding="utf8"))
          if (proof.get("model")!="gpt-image-2.5-flare" or not proof.get("real_ai_generated") or
              proof.get("procedural_assets")!=0):raise RuntimeError("REAL_TRANSPARENT_AI_NOT_VERIFIED")
          if len(frames)!=len(story["slides"]):raise RuntimeError("STORY_FRAME_COUNT_MISMATCH")
          print("ACOLAD_REAL_GPT25_FULL_STORY_PREVIEW_PASSED",json.dumps({
            "date_tehran":day.isoformat(),"model":proof["model"],
            "alpha_assets":proof["image_count"],"frames":len(frames),
            "critics":[x.get("score") for x in ready["critics"]],
            "source_urls":[x.get("url") for x in evidence],
            "social_posts_created":0,"novinhub_mutations":0,
            "status":"PREVIEW_PASSED_NOT_PUBLISHED"},ensure_ascii=False),flush=True)
          PY
      - name: Save REAL cutouts, source trace and final composited slides for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-20261108-gpt25-flare-real-cutouts-7slides
          path: |
            acolad_concept_assets/
            acolad_v4_daily_publication/
            acolad_daily_editorial_output/preview_status.json
            acolad_luna_research_preview/status.json
          retention-days: 14
          if-no-files-found: warn
