name: Acolad V4 Verify actual NovinHub Publication — READ ONLY
on:
  schedule:
    - cron: '15 15 * * *'  # Tehran 18:45
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 Pillow==11.3.0
      - name: Provider GET only; never publish or queue
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: python -u acolad_v4_verify_publication.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-v4-post-publication-provider-check
          path: acolad_v4_publish_check/status.json
          retention-days: 14
          if-no-files-found: warn
