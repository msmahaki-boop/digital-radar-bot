name: Acolad Nov7 NovinHub actual post states READ ONLY (NO SOCIAL)
on:
  push:
    branches: [fix/acolad-gemini-lite-recovery-20261107]
    paths: [ops/acolad-nov7-provider-readonly.trigger]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0 beautifulsoup4==4.14.2
      - name: GET accounts and publications only; never send
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json
          from acolad_v4_hourly_publish import observe,token
          day=datetime.now(ZoneInfo('Asia/Tehran')).date()
          state=observe(token(),day)
          print('ACOLAD_PROVIDER_STATES_READ_ONLY',json.dumps({'date':day.isoformat(),'states':state},ensure_ascii=False),flush=True)
          PY
