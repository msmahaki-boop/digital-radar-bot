name: Acolad NovinHub Two-channel REAL Draft Integration Test (NO PUBLICATION)
on:
  push:
    branches: [feature/acolad-gpt2-novinhub-20261104]
    paths:
      - ops/acolad-novinhub-create-two-test-drafts-20261104.trigger
permissions:
  contents: read
concurrency:
  group: acolad-novinhub-one-time-two-drafts
  cancel-in-progress: false
jobs:
  create-safe-drafts:
    if: contains(github.event.head_commit.message, '[NOVINHUB_TWO_DRAFTS_APPROVED]')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Persian text dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-color-emoji libharfbuzz0b libfribidi0 >/dev/null
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate provider ladder and NovinHub API safety
        run: |
          python -m unittest discover -s tests -p 'test_acolad_story_image_ladder.py' -v
          python -m unittest discover -s tests -p 'test_acolad_novinhub_bridge.py' -v
      - name: Generate current verified news; GPT Image 2 two frames then fallbacks
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GAPGPT_API_KEY: ${{ secrets.GAPGPT_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ACOLAD_IMAGE_LADDER_ENABLED: 'true'
          ACOLAD_IMAGE_API_PAID_ENABLED: 'true'
          ACOLAD_MAX_AGE_HOURS: '48'
          ACOLAD_REQUIRE_DATED_NEWS: '1'
        run: python -u story_test.py
      - name: Check 5 complete 1080x1920 images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          files=sorted(Path("stories_output").glob("*.png"))
          assert len(files)==5,files
          for f in files:
              with Image.open(f) as image:assert image.size==(1080,1920)
          PY
      - name: Create ONE NovinHub story draft and ONE Telegram test draft
        env:
          NOVINHUB_API_TOKEN: ${{ secrets.NOVINHUB_API_TOKEN }}
          NOVINHUB_TOKEN: ${{ secrets.NOVINHUB_TOKEN }}
          NOVINHUB_ACCESS_TOKEN: ${{ secrets.NOVINHUB_ACCESS_TOKEN }}
          ACOLAD_NOVINHUB_DRAFT_APPROVAL: APPROVED_CREATE_TEST_DRAFTS
        run: python acolad_novinhub_bridge.py --mode draft --story-dir stories_output
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-novinhub-two-real-drafts-e2e
          path: |
            stories_output/
            acolad_visual_provenance/
            acolad_novinhub_e2e/
          retention-days: 14
          if-no-files-found: warn
