name: Acolad Telegram 7 Topics Every 3 Hours

# All schedule expressions are UTC. Tehran is UTC+03:30 year-round.
# Each 3-hour Tehran slot has three attempts at :17, :32, :47.
# The existing publishing-state lock ensures at most ONE channel post per slot.
# OLD NEWS SCHEDULE DISABLED 2026-11-04; safety backup branch safety/acolad-before-narrative-switch-20261104
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview only; legacy public posting retired'
        required: true
        default: preview
        type: choice
        options:
          - preview
      slot_hour:
        description: 'Preview category: 0,3,6,9,12,15,18,21 (leave empty for current slot)'
        required: false
        type: string
      approval:
        description: 'For manual publish ONLY type PUBLISH_ONE_APPROVED'
        required: false
        type: string

permissions:
  contents: write  # needed only to reserve unique slot/URL in repo history

concurrency:
  group: acolad-telegram-public-feed
  cancel-in-progress: false

jobs:
  telegram-feed:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Refresh publishing history from main
        run: |
          git fetch origin main
          git checkout -B main origin/main
      - name: Rate news and prepare one branded Telegram post
        id: prepare
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACOLAD_TELEGRAM_V4_APPROVED: ${{ vars.ACOLAD_TELEGRAM_V4_APPROVED }}
          ACOLAD_TELEGRAM_AUTOPUBLISH_ENABLED: ${{ vars.ACOLAD_TELEGRAM_AUTOPUBLISH_ENABLED }}
          PIPELINE_MODE: ${{ github.event_name == 'schedule' && 'publish' || inputs.mode || 'preview' }}
          APPROVAL: ${{ inputs.approval }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SLOT_HOUR: ${{ inputs.slot_hour }}
        run: |
          slot_arg=()
          if [[ -n "${SLOT_HOUR}" ]]; then
            if ! [[ "${SLOT_HOUR}" =~ ^(0|3|6|9|12|15|18|21)$ ]]; then
              echo 'slot_hour must be 0,3,6,9,12,15,18,21'
              exit 1
            fi
            slot_arg=(--slot-hour "$SLOT_HOUR")
          fi
          python - <<'PYTIME'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          n = datetime.now(ZoneInfo('Asia/Tehran'))
          h = n.hour // 3 * 3
          s = n.replace(hour=h, minute=17, second=0, microsecond=0)
          print(f'CLOCK (Tehran): {n.isoformat()} | current slot: {s.isoformat()} | offset_minutes: {(n-s).total_seconds()/60:+.1f}', flush=True)
          PYTIME
          python telegram_daily_v4.py --phase prepare --mode "$PIPELINE_MODE" --approval "$APPROVAL" "${slot_arg[@]}"
          if [[ -f telegram_daily_output/status.txt && "$(cat telegram_daily_output/status.txt)" == 'READY' ]]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi
          echo "mode=$PIPELINE_MODE" >> "$GITHUB_OUTPUT"
      - name: Write readable slot diagnostic
        if: always()
        shell: bash
        run: |
          echo '### Acolad Telegram run status' >> "$GITHUB_STEP_SUMMARY"
          echo "- Event: ${{ github.event_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested time UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> "$GITHUB_STEP_SUMMARY"
          TZ=Asia/Tehran date '+- Tehran at execution: %Y-%m-%d %H:%M:%S %Z' >> "$GITHUB_STEP_SUMMARY"
          if [[ -f telegram_daily_output/status.txt ]]; then
            echo "- Prepared post status: $(cat telegram_daily_output/status.txt)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- Prepared post status: none (review preparation logs)' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '- READY is **not** PUBLISHED. Confirm the send step and its PUBLISHED receipt.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acolad-telegram-3hour-preview-${{ github.run_number }}
          path: telegram_daily_output/
          if-no-files-found: warn
          retention-days: 7
      - name: Confirm channel admin rights before reserving
        if: ${{ steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.mode == 'publish' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
        run: |
          python - <<'PY'
          import os
          from telegram_send import preflight
          preflight(os.environ['BOT_TOKEN'], os.environ['TELEGRAM_CHANNEL_ID'])
          PY
      - name: Reserve slot and article BEFORE sending (fail closed)
        if: ${{ steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.mode == 'publish' }}
        env:
          ACOLAD_TELEGRAM_AUTOPUBLISH_ENABLED: ${{ vars.ACOLAD_TELEGRAM_AUTOPUBLISH_ENABLED }}
          ACOLAD_TELEGRAM_V4_APPROVED: ${{ vars.ACOLAD_TELEGRAM_V4_APPROVED }}
          APPROVAL: ${{ inputs.approval }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          git fetch origin main
          git checkout -B main origin/main
          python telegram_daily_v4.py --phase claim --mode publish --approval "$APPROVAL"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_public_state.json
          git commit -m 'Reserve Acolad Telegram publishing slot [skip ci]'
          git push origin HEAD:main  # MUST succeed; otherwise Telegram MUST NOT send
      - name: Publish exactly ONE post to public Telegram channel
        if: ${{ steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.mode == 'publish' }}
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID }}
          ACOLAD_TELEGRAM_AUTOPUBLISH_ENABLED: ${{ vars.ACOLAD_TELEGRAM_AUTOPUBLISH_ENABLED }}
          ACOLAD_TELEGRAM_V4_APPROVED: ${{ vars.ACOLAD_TELEGRAM_V4_APPROVED }}
          APPROVAL: ${{ inputs.approval }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python telegram_daily_v4.py --phase send --mode publish --approval "$APPROVAL"
      - name: Save Telegram message receipt
        if: ${{ success() && steps.prepare.outputs.ready == 'true' && steps.prepare.outputs.mode == 'publish' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add telegram_public_state.json
          git commit -m 'Record Acolad Telegram sent message [skip ci]' || true
          git push origin HEAD:main
